name: Reusable PHPUnit

on:
  workflow_call:
    inputs:
      extension_name:
        required: true
        type: string
      platform_branch:
        required: true
        type: string
      coverage:
        required: false
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Setup extension
        uses: shopware/github-actions/setup-extension@main
        with:
          extensionName: ${{ inputs.extension_name }}
          install: true
          shopwareVersion: ${{ inputs.platform_branch }}
          extraRepositories: |
            {
              "${{ inputs.extension_name }}": {
                "type": "path",
                "url": "custom/plugins/${{ inputs.extension_name }}",
                "symlink": true
              }
            }

      - name: Run PHPUnit
        run: |
          composer -d custom/plugins/${{ inputs.extension_name }} run phpunit -- --log-junit junit.xml ${{ inputs.coverage && '--coverage-clover clover.xml' || '' }}
          # PHPUnit writes </testsuites> only once the whole suite has run, so a report without it
          # means the process died early (e.g. exit() in code under test) even though it exited 0
          grep -q '</testsuites>' custom/plugins/${{ inputs.extension_name }}/junit.xml

      - name: Upload coverage to Codecov
        if: inputs.coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          root_dir: ${{ github.workspace }}/custom/plugins/${{ inputs.extension_name }}
          working-directory: ${{ github.workspace }}/custom/plugins/${{ inputs.extension_name }}
          files: ./clover.xml
