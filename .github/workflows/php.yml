name: PHP checks

on:
  pull_request:
    paths:
      - composer.json
      - src/**/*.php
      - tests/**/*.php
      - .github/workflows/**
  push:
    branches:
      - trunk
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codestyle_php:
    name: Codestyle
    runs-on: ubuntu-latest
    steps:
      - uses: shopware/github-actions/cs-fixer@main
        with:
          rules: ''

  phpstan:
    name: PHPStan
    uses: ./.github/workflows/action-phpstan.yml
    with:
      extension_name: ${{ github.event.repository.name }}

  phpunit:
    name: PHPUnit
    strategy:
      fail-fast: false
      matrix:
        shopware-version:
          - trunk
          - 6.6.x
    uses: ./.github/workflows/action-phpunit.yml
    with:
      extension_name: ${{ github.event.repository.name }}
      platform_branch: ${{ matrix.shopware-version }}

  smoke_test:
    name: Smoke test
    uses: ./.github/workflows/action-smoke-test.yml
    with:
      extension_name: ${{ github.event.repository.name }}
